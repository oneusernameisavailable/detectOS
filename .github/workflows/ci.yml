name: CI — fx-detect-os.sh

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not tracking upstream main: an unpinned bats + a weekly cron meant
  # an upstream change could break CI non-deterministically. Bump deliberately.
  BATS_VERSION: "v1.11.0"
  # 0.11.0 is the version the source's shellcheck directives are written against
  # (SC2329 is 0.11-only, so on 0.9.0 those disables were silent no-ops).
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          curl -sL https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz | tar xJ
          sudo cp shellcheck-v${SHELLCHECK_VERSION}/shellcheck /usr/local/bin/
      # No --severity flag: the default (style) is stricter than the previous
      # --severity=warning, and every file here is already clean at full
      # severity, so this costs nothing and catches more.
      - name: Lint fx-detect-os.sh
        run: shellcheck --shell=bash fx-detect-os.sh
      - name: Lint test scripts
        run: |
          shellcheck --shell=bash test/bash40_smoke.sh
          shellcheck --shell=bash test/fuzz_detect.sh
          shellcheck --shell=bash test/fuzz_redact.sh
          shellcheck --shell=bash test/fuzz_sanitize.sh
          shellcheck --shell=bash test/detect_os.bats

  bats:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian family
          - distro: debian:12
            label: debian-12
          - distro: debian:13
            label: debian-13
          # debian:11 was removed: bullseye is EOL, deb.debian.org 404s its
          # packages, and archive.debian.org has broken perl-base pinning
          # ("perl-base (= 5.32.1-4+deb11u3) but 5.32.1-4+deb11u5 is to be
          # installed"). Keeping it green would need a pinned
          # snapshot.debian.org timestamp or --allow-downgrades, which rots in
          # a different way every time the archive shifts.
          - distro: ubuntu:24.04
            label: ubuntu-24.04
          - distro: ubuntu:22.04
            label: ubuntu-22.04
          - distro: ubuntu:20.04
            label: ubuntu-20.04
          # RHEL family
          - distro: rockylinux:9
            label: rocky-9
          - distro: almalinux:9
            label: almalinux-9
          - distro: amazonlinux:2023
            label: amazon-linux-2023
          - distro: oraclelinux:9
            label: oracle-linux-9
          # Fedora family
          - distro: fedora:41
            label: fedora-41
          - distro: fedora:40
            label: fedora-40
          - distro: fedora:39
            label: fedora-39
          # SUSE family
          - distro: opensuse/tumbleweed:latest
            label: opensuse-tumbleweed
          - distro: opensuse/leap:15.5
            label: opensuse-leap-15.5
          # Arch family
          - distro: archlinux:latest
            label: arch-latest
          # Alpine family
          - distro: alpine:3.21
            label: alpine-3.21
          - distro: alpine:3.20
            label: alpine-3.20
          # Minimal-distro coverage (no lsb_release, stripped base image).
          # This is NOT a bash 4.0 test: the install step above pulls the
          # DISTRO's bash, which is 5.2 on bookworm. The declared bash >= 4.0
          # floor is enforced by the separate `bash40` job, which runs the real
          # bash 4.0 binary.
          - distro: debian:12-slim
            label: debian-12-slim

    container:
      image: ${{ matrix.distro }}

    steps:
      - name: Install prerequisites
        run: |
          if command -v apt-get &>/dev/null; then
            apt-get update -qq && apt-get install -y -qq git bash coreutils
          elif command -v dnf &>/dev/null; then
            # No coreutils: EL9 images ship coreutils-single, and pulling the
            # coreutils metapackage conflicts with it ("cannot install the best
            # candidate"), which failed rocky/almalinux/amazonlinux. The wc,
            # stat and mktemp the library uses already come from coreutils-single.
            dnf install -y -q git bash
          elif command -v yum &>/dev/null; then
            yum install -y -q git bash
          elif command -v zypper &>/dev/null; then
            zypper --non-interactive --quiet install git bash coreutils
          elif command -v apk &>/dev/null; then
            apk add --no-cache git bash coreutils
          elif command -v pacman &>/dev/null; then
            pacman -Sy --noconfirm git bash coreutils
          fi
          bash --version | head -1
          git --version
      - name: Checkout repo
        run: |
          git clone --depth 1 https://github.com/oneusernameisavailable/detectOS.git .
          pwd
      - name: Install bats from source
        run: |
          git clone --depth 1 --branch "$BATS_VERSION" https://github.com/bats-core/bats-core.git /tmp/bats-core
          /tmp/bats-core/install.sh /usr/local
          bats --version
      # lsb_release is OPTIONAL by design — the library's own header calls it
      # opportunistic, the file-based ladder steps are authoritative, and the
      # bats setup() stubs lsb_release as a shell function so the suite never
      # needs the real binary. Oracle Linux has no `redhat-lsb-core` package at
      # all, so a missing one must not fail the leg.
      - name: Install lsb_release
        continue-on-error: true
        run: |
          if command -v apt-get &>/dev/null; then
            apt-get install -y -qq lsb-release
          elif command -v dnf &>/dev/null; then
            dnf install -y -q redhat-lsb-core
          elif command -v zypper &>/dev/null; then
            zypper --non-interactive --quiet install lsb-release
          elif command -v apk &>/dev/null; then
            apk add --no-cache lsb-release
          fi
      - name: Run bats suite
        run: bats test/detect_os.bats
      - name: Run bash 4.0 smoke test
        run: bash test/bash40_smoke.sh fx-detect-os.sh
      - name: Run fuzz tests
        run: |
          bash test/fuzz_detect.sh fx-detect-os.sh
          bash test/fuzz_redact.sh fx-detect-os.sh
          bash test/fuzz_sanitize.sh fx-detect-os.sh

  bash40:
    # The header declares a bash >= 4.0 floor. Nothing else in this workflow
    # proves it: every matrix leg runs INSIDE a container, so the bats suite's
    # own R18-403 test (which needs docker) skips on all of them, and the
    # `debian-12-slim` leg installs the distro's bash 5.2. This job runs the
    # real bash 4.0 binary so the floor is enforced rather than asserted.
    # `bash:4.0` is a fixed version tag, not `latest`, so this stays reproducible.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real bash 4.0 floor check
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work bash:4.0 \
            bash /work/test/bash40_smoke.sh /work/fx-detect-os.sh

  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bash version
        run: bash --version | head -1
      - name: Source library check
        run: |
          bash -c 'source fx-detect-os.sh && detect_os && echo "OS_ID=$OS_ID OS_DISTRO=$OS_DISTRO"'
      - name: Verify functions
        run: bash -c 'source fx-detect-os.sh && type os_id os_like os_pretty os_distro os_trust_level'
